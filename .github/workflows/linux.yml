name: Linux

on:
  # push:
  #   branches: [main, development]
  # Releases (pushes to main/development, v* tags) are built by release.yml.
  # pull_request:
  #   branches: [main, development]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libmpv-dev

      # flutter_vodozemac builds its Rust crypto library through cargokit,
      # which requires rustup (preinstalled on GitHub runners; this keeps
      # the toolchain current and explicit).
      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build release bundle
        run: flutter build linux --release

      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/protea-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protea-linux-x64
          path: protea-linux-x64.tar.gz
          if-no-files-found: error
